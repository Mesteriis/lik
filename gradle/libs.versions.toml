[versions]
agp = "9.2.1"
junit = "4.13.2"
androidx-test = "1.7.0"
androidx-test-ext-junit = "1.3.0"
androidx-activity = "1.13.0"
androidx-lifecycle = "2.11.0"
androidx-recyclerview = "1.4.0"
room = "2.8.4"
ksp = "2.3.9"
paging = "3.5.1"
work = "2.11.2"

[libraries]
junit4 = { module = "junit:junit", version.ref = "junit" }
androidx-activity = { module = "androidx.activity:activity", version.ref = "androidx-activity" }
androidx-livedata = { module = "androidx.lifecycle:lifecycle-livedata-core", version.ref = "androidx-lifecycle" }
androidx-recyclerview = { module = "androidx.recyclerview:recyclerview", version.ref = "androidx-recyclerview" }
androidx-room-runtime = { module = "androidx.room:room-runtime", version.ref = "room" }
androidx-room-compiler = { module = "androidx.room:room-compiler", version.ref = "room" }
androidx-room-paging = { module = "androidx.room:room-paging", version.ref = "room" }
androidx-paging = { module = "androidx.paging:paging-runtime", version.ref = "paging" }
androidx-work = { module = "androidx.work:work-runtime", version.ref = "work" }
androidx-work-testing = { module = "androidx.work:work-testing", version.ref = "work" }
androidx-test-core = { module = "androidx.test:core", version.ref = "androidx-test" }
androidx-test-runner = { module = "androidx.test:runner", version.ref = "androidx-test" }
androidx-test-ext-junit = { module = "androidx.test.ext:junit", version.ref = "androidx-test-ext-junit" }

[plugins]
android-application = { id = "com.android.application", version.ref = "agp" }
ksp = { id = "com.google.devtools.ksp", version.ref = "ksp" }
androidx-room = { id = "androidx.room", version.ref = "room" }
